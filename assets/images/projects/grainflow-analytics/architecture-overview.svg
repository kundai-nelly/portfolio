      .sub { fill: #4E555C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
      .stage { fill: #FFFFFF; stroke: #C9C8BD; stroke-width: 1.5; rx: 4; }
      .stage-hi { fill: #EAF2ED; stroke: #1B6B4A; stroke-width: 1.6; rx: 4; }
      .stage-warn { fill: #F5EEDC; stroke: #8A6415; stroke-width: 1.5; rx: 4; }
      .st-num { fill: #1B6B4A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
      .st-title { fill: #14181C; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .st-code { fill: #4E555C; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
      .arrow { stroke: #1B6B4A; stroke-width: 1.8; fill: none; }

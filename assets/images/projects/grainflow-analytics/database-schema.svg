<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FBFAF7; }
      .header { fill: #14181C; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 18px; font-weight: 600; }
      .sub { fill: #4E555C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
      .layer-box { fill: #FFFFFF; stroke: #C9C8BD; stroke-width: 1.5; rx: 4; }
      .layer-title { fill: #1B6B4A; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; }
      .tbl { fill: #F2F1EC; stroke: #C9C8BD; stroke-width: 1.2; rx: 3; }
      .tbl-fact { fill: #EAF2ED; stroke: #1B6B4A; stroke-width: 1.4; rx: 3; }
      .tbl-param { fill: #F5EEDC; stroke: #8A6415; stroke-width: 1.2; rx: 3; }
      .t-head { fill: #14181C; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; }
      .t-body { fill: #4E555C; font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
      .edge { stroke: #6A7077; stroke-width: 1.2; fill: none; }
      .edge-active { stroke: #1B6B4A; stroke-width: 1.4; fill: none; }
      .edge-dash { stroke: #8A6415; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .note { fill: #14181C; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 11.5px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="660"/>
  <text x="32" y="38" class="header">GrainFlow Analytics — PostgreSQL 16.4 Relational (3NF) &amp; Analytical Star-Schema Architecture</text>
  <text x="32" y="58" class="sub">Implemented Architecture: 15 Operational Tables (56,479 rows) -&gt; 11 Read-Only Star-Schema SQL Views (49,050 rows) -&gt; Tabular Model (14 Tables, 17 Relationships)</text>

  <!-- LEFT PANEL: LAYER 1 (3NF) -->
  <rect x="32" y="76" width="545" height="552" class="layer-box"/>
  <text x="50" y="102" class="layer-title">LAYER 1: NORMALIZED OPERATIONAL SCHEMA (3NF BASE TABLES)</text>
  <text x="50" y="120" class="t-body">Single Source of Truth ·NUMERIC(p,s) exact precision · Composite FKs · Partial Unique Index</text>

  <!-- Master Reference Entities -->
  <rect x="50" y="140" width="155" height="68" class="tbl"/>
  <text x="60" y="158" class="t-head">districts (18)</text>
  <text x="60" y="174" class="t-body">PK: district_id</text>
  <text x="60" y="188" class="t-body">6 SA Provinces, Towns</text>

  <rect x="225" y="140" width="160" height="68" class="tbl"/>
  <text x="235" y="158" class="t-head">depots (8)</text>
  <text x="235" y="174" class="t-body">PK: depot_id | FK: district</text>
  <text x="235" y="188" class="t-body">36,000 MT Rated Cap.</text>

  <rect x="405" y="140" width="152" height="68" class="tbl"/>
  <text x="415" y="158" class="t-head">farmers (400)</text>
  <text x="415" y="174" class="t-body">PK: farmer_id</text>
  <text x="415" y="188" class="t-body">FK: district, depot</text>

  <rect x="50" y="228" width="155" height="68" class="tbl"/>
  <text x="60" y="246" class="t-head">grain_categories (5)</text>
  <text x="60" y="262" class="t-body">PK: grain_category_id</text>
  <text x="60" y="276" class="t-body">Moisture/Defect Cutoffs</text>

  <rect x="225" y="228" width="160" height="68" class="tbl"/>
  <text x="235" y="246" class="t-head">grain_grade_prices (20)</text>
  <text x="235" y="262" class="t-body">PK: grade_price_id</text>
  <text x="235" y="276" class="t-body">5 Crops x 4 Grades (ZAR)</text>

  <rect x="405" y="228" width="152" height="68" class="tbl"/>
  <text x="415" y="246" class="t-head">transport_methods (4)</text>
  <text x="415" y="262" class="t-body">LDV, MRG, HBL, RAIL</text>
  <text x="415" y="276" class="t-body">Fuel Shares: 30%–54%</text>

  <!-- Intake & Quality Chain -->
  <rect x="50" y="320" width="155" height="82" class="tbl-fact"/>
  <text x="60" y="338" class="t-head">deliveries (3,000)</text>
  <text x="60" y="354" class="t-body">PK: delivery_id</text>
  <text x="60" y="368" class="t-body">Submitted: 39,027.00 MT</text>
  <text x="60" y="382" class="t-body">Accepted: 37,007.27 MT</text>
  <text x="60" y="396" class="t-body">1 Row/Lot Mass Balance</text>

  <rect x="225" y="320" width="160" height="82" class="tbl-fact"/>
  <text x="235" y="338" class="t-head">quality_inspections</text>
  <text x="235" y="354" class="t-body">3,285 rows (1:N sequence)</text>
  <text x="235" y="368" class="t-body">UQ: is_final_inspection</text>
  <text x="235" y="382" class="t-body">Prevents 1:N Fan Trap</text>
  <text x="235" y="396" class="t-body">351 Multi-Breach Lots</text>

  <rect x="405" y="320" width="152" height="82" class="tbl-fact"/>
  <text x="415" y="338" class="t-head">farmer_payments</text>
  <text x="415" y="354" class="t-body">2,898 settled lots</text>
  <text x="415" y="368" class="t-body">Comp FK (delivery,farmer)</text>
  <text x="415" y="382" class="t-body">Net: R 212,735,855.88</text>
  <text x="415" y="396" class="t-body">Downgrade: R 8.40M</text>

  <!-- Inventory, Logistics & Cost Chain -->
  <rect x="50" y="424" width="240" height="82" class="tbl-fact"/>
  <text x="60" y="442" class="t-head">depot_inventory_daily (43,800)</text>
  <text x="60" y="458" class="t-body">Grain: 8 Depots x 5 Crops x 3 Grades x 365d</text>
  <text x="60" y="472" class="t-body">Opening 7,200 MT -&gt; Closing 9,476.57 MT</text>
  <text x="60" y="486" class="t-body">Storage Loss: 215.70 MT (R 1.52M proxy)</text>
  <text x="60" y="500" class="t-body">53 Critical (&gt;=90%) / 149 Warning Days</text>

  <rect x="310" y="424" width="247" height="82" class="tbl-fact"/>
  <text x="320" y="442" class="t-head">transport_shipments (1,531)</text>
  <text x="320" y="458" class="t-body">Single Vehicle / 44t Rail Hopper Grain</text>
  <text x="320" y="472" class="t-body">Dispatched: 34,515.50 MT</text>
  <text x="320" y="486" class="t-body">Freight: R 19.50M (Fuel: R 8.82M)</text>
  <text x="320" y="500" class="t-body">Rail: R 1.0829 vs Road: R 1.5829/MT-km</text>

  <rect x="50" y="526" width="160" height="76" class="tbl"/>
  <text x="60" y="544" class="t-head">commercial_buyers (12)</text>
  <text x="60" y="560" class="t-body">PK: buyer_id | FK: district</text>
  <text x="60" y="574" class="t-body">Millers, Processors</text>

  <rect x="225" y="526" width="165" height="76" class="tbl-fact"/>
  <text x="235" y="544" class="t-head">buyer_receipts (1,531)</text>
  <text x="235" y="560" class="t-body">Received: 34,410.87 MT</text>
  <text x="235" y="574" class="t-body">Transit Loss: 104.63 MT</text>
  <text x="235" y="588" class="t-body">Revenue: R 232.86M</text>

  <rect x="405" y="526" width="152" height="76" class="tbl-fact"/>
  <text x="415" y="544" class="t-head">depot_op_costs (96)</text>
  <text x="415" y="560" class="t-body">8 Depots x 12 Months</text>
  <text x="415" y="574" class="t-body">Fixed: R 14.58M</text>
  <text x="415" y="588" class="t-body">Total: R 23,319,186.81</text>

  <!-- RIGHT PANEL: LAYER 2 (STAR SCHEMA) -->
  <rect x="615" y="76" width="553" height="552" class="layer-box"/>
  <text x="635" y="102" class="layer-title">LAYER 2: ANALYTICAL STAR SCHEMA (SQL VIEWS &amp; TABULAR BIM)</text>
  <text x="635" y="120" class="t-body">7 Conformed Dimensions · 4 Fact Views · 2 What-If Parameter Tables · 78 DAX Measures</text>

  <!-- 7 Dimensions on Left of Layer 2 -->
  <rect x="635" y="140" width="175" height="44" class="tbl"/>
  <text x="645" y="158" class="t-head">vw_dim_date (380d)</text>
  <text x="645" y="174" class="t-body">2025-01-01 to 2026-01-15</text>

  <rect x="635" y="194" width="175" height="44" class="tbl"/>
  <text x="645" y="212" class="t-head">vw_dim_depot (8)</text>
  <text x="645" y="228" class="t-body">36,000 MT Rated Capacity</text>

  <rect x="635" y="248" width="175" height="44" class="tbl"/>
  <text x="645" y="266" class="t-head">vw_dim_geography (18)</text>
  <text x="645" y="282" class="t-body">District, Town, Province</text>

  <rect x="635" y="302" width="175" height="44" class="tbl"/>
  <text x="645" y="320" class="t-head">vw_dim_farmer (400)</text>
  <text x="645" y="336" class="t-body">Smallholder Attributes</text>

  <rect x="635" y="356" width="175" height="44" class="tbl"/>
  <text x="645" y="374" class="t-head">vw_dim_grain_cat (5)</text>
  <text x="645" y="390" class="t-body">Maize, Soy, Sun, Wht, Sor</text>

  <rect x="635" y="410" width="175" height="44" class="tbl"/>
  <text x="645" y="428" class="t-head">vw_dim_grade_price (20)</text>
  <text x="645" y="444" class="t-body">GRADE_1..3 &amp; REJECTED</text>

  <rect x="635" y="464" width="175" height="44" class="tbl"/>
  <text x="645" y="482" class="t-head">vw_dim_transport &amp; buyer</text>
  <text x="645" y="498" class="t-body">4 Modes &amp; 12 Off-Takers</text>

  <!-- 4 Fact Views on Right of Layer 2 -->
  <rect x="865" y="140" width="282" height="78" class="tbl-fact"/>
  <text x="875" y="158" class="t-head">vw_fact_deliveries_quality_payments</text>
  <text x="875" y="174" class="t-body">3,000 rows (1:1 Final Inspection Join)</text>
  <text x="875" y="188" class="t-body">Active Date: delivery_date</text>
  <text x="875" y="202" class="t-body">Inactive Role Date: payment_date (USERELATIONSHIP)</text>

  <rect x="865" y="232" width="282" height="72" class="tbl-fact"/>
  <text x="875" y="250" class="t-head">vw_fact_depot_inventory_daily</text>
  <text x="875" y="266" class="t-body">43,800 rows (Daily Depot x Crop x Grade)</text>
  <text x="875" y="280" class="t-body">Semi-Additive Stock &amp; Capacity Breach Flags</text>
  <text x="875" y="294" class="t-body">Peak Network Stock: 26,498.38 MT (73.61%)</text>

  <rect x="865" y="318" width="282" height="78" class="tbl-fact"/>
  <text x="875" y="336" class="t-head">vw_fact_shipments_receipts</text>
  <text x="875" y="352" class="t-body">1,531 rows (Origin Dispatch + Arrival Receipt)</text>
  <text x="875" y="366" class="t-body">Active Date: dispatch_date</text>
  <text x="875" y="380" class="t-body">Inactive Role Date: receipt_date (USERELATIONSHIP)</text>

  <rect x="865" y="410" width="282" height="64" class="tbl-fact"/>
  <text x="875" y="428" class="t-head">vw_fact_depot_operating_costs</text>
  <text x="875" y="444" class="t-body">96 rows (Monthly Fixed, Handling, Storage)</text>
  <text x="875" y="458" class="t-body">Reconciled to KPI-22 &amp; Accrual Pre-Tax P&amp;L</text>

  <!-- Disconnected Parameter & Measures Tables -->
  <rect x="635" y="526" width="245" height="76" class="tbl-param"/>
  <text x="645" y="544" class="t-head">Disconnected What-If Tables (2)</text>
  <text x="645" y="560" class="t-body">Param_Fuel_Ladder (-10% to +30%)</text>
  <text x="645" y="574" class="t-body">Param_Management_Lever (M1, M2, M3)</text>
  <text x="645" y="588" class="t-body">M3: 20% Long-Haul Shift (-R 445,518.96)</text>

  <rect x="895" y="526" width="252" height="76" class="tbl-param"/>
  <text x="905" y="544" class="t-head">_Measures Table (model.bim)</text>
  <text x="905" y="560" class="t-body">78 Explicit DAX Measures (5 Folders)</text>
  <text x="905" y="574" class="t-body">15 Active + 2 Inactive Relationships</text>
  <text x="905" y="588" class="t-body">0.00 Variance Across 36 Control Totals</text>

  <!-- Connectors between Dimensions and Facts -->
  <line x1="810" y1="162" x2="865" y2="162" class="edge-active"/>
  <line x1="810" y1="168" x2="865" y2="255" class="edge-active"/>
  <line x1="810" y1="174" x2="865" y2="345" class="edge-active"/>
  <line x1="810" y1="216" x2="865" y2="180" class="edge-active"/>
  <line x1="810" y1="216" x2="865" y2="268" class="edge-active"/>
  <line x1="810" y1="216" x2="865" y2="435" class="edge-active"/>
  <line x1="810" y1="378" x2="865" y2="195" class="edge-active"/>
  <line x1="810" y1="378" x2="865" y2="280" class="edge-active"/>
  <line x1="810" y1="378" x2="865" y2="365" class="edge-active"/>

  <!-- Bridge Arrow Between Layer 1 and Layer 2 -->
  <path d="M 578 340 L 612 340" stroke="#1B6B4A" stroke-width="2.5" fill="none"/>
  <polygon points="614,340 606,335 606,345" fill="#1B6B4A"/>
</svg>

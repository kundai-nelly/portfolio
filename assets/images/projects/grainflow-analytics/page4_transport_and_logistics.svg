        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1B365D"/>
            <stop offset="100%" stop-color="#2C3E50"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="1760" height="990" fill="#F8FAFC"/>


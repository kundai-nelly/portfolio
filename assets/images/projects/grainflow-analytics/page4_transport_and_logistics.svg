    <text x="40" y="64" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Page 4: Transport &amp; Logistics Efficiency | Outbound Logistics, Modal Shift Economics &amp; Transit Loss Rates</text>
    <rect x="1540" y="24" width="180" height="36" rx="6" fill="#D99B26"/>
    <text x="1560" y="47" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">PHASE 7 RECONCILED</text>

    <!-- KPI Row -->
    
        <g transform="translate(40, 110)">
